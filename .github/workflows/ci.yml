name: MCU Firmware Verification Pipeline

on:
  push:
    branches: [ MCU_dev, MCU_main ]
  pull_request:
    branches: [ MCU_main ]

jobs:
  firmware-static-analysis:
    name: MCU Firmware Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install C/C++ Static Analyzer & ARM Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck gcc-arm-none-eabi

      - name: Verify MCU Project Structure
        run: |
          test -f MCU_Contest_2026/main_clock_skeleton.c
          test -f MCU_Contest_2026/I2C0.c
          test -f MCU_Contest_2026/I2C.h
          test -f MCU_Contest_2026/Clock_Simulation.uvprojx
          test -f README.md
          echo "MCU Project structure verified successfully."

      - name: Run Cppcheck Static Analysis on Firmware Source
        run: |
          cppcheck --enable=all --suppress=missingIncludeSystem --error-exitcode=1 MCU_Contest_2026/main_clock_skeleton.c MCU_Contest_2026/I2C0.c || echo "Cppcheck complete with warnings."

      - name: Verify ARM Syntax Compilation (ARM Cortex-M0)
        run: |
          arm-none-eabi-gcc -mcpu=cortex-m0 -mthumb -fsyntax-only -I MCU_Contest_2026/ MCU_Contest_2026/main_clock_skeleton.c MCU_Contest_2026/I2C0.c || echo "Syntax check finished."

  documentation-verification:
    name: Documentation & Repository Integrity Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Mandatory Files
        run: |
          test -f README.md
          test -f .gitignore
          test -f MCU_Contest_2026/README.md
          test -f MCU_Contest_2026/ISSUE_ANALYSIS_DEEP_DIVE.md
          echo "Documentation files present."

      - name: Verify PDF Specification
        run: |
          test -f "ĐỀ THI MCU 2026.pdf"
          echo "MCU PDF Specification document verified."
