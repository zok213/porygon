name: Firmware Verification Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  simulation:
    name: Host Simulation (54 firmware checks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Host Toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc cppcheck

      - name: Build Simulation Harness
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -DMOCK_SIMULATION \
              -I MCU_Contest_2026 -I MCU_Contest_2026/sim \
              MCU_Contest_2026/main.c MCU_Contest_2026/clock.c \
              MCU_Contest_2026/keypad.c MCU_Contest_2026/display.c \
              MCU_Contest_2026/buzzer.c MCU_Contest_2026/eeprom.c \
              MCU_Contest_2026/sim/SN32F400_mock.c \
              MCU_Contest_2026/sim/sim_main.c \
              -o clock_sim

      - name: Run Firmware Checks
        run: ./clock_sim

  static-analysis:
    name: Static Analysis (cppcheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Run cppcheck on Firmware (host-build view)
        run: |
          cppcheck --enable=warning,style,performance,portability \
                   --error-exitcode=1 --suppress=missingIncludeSystem \
                   -DMOCK_SIMULATION -I MCU_Contest_2026 -I MCU_Contest_2026/sim \
                   MCU_Contest_2026/main.c MCU_Contest_2026/clock.c \
                   MCU_Contest_2026/keypad.c MCU_Contest_2026/display.c \
                   MCU_Contest_2026/buzzer.c MCU_Contest_2026/eeprom.c

  production-path:
    name: Production Path Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Host Toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Syntax-check all modules (non-MOCK path, -Werror)
        run: |
          for f in main.c clock.c keypad.c display.c buzzer.c eeprom.c; do
            gcc -std=c99 -Wall -Wextra -Werror -fsyntax-only \
                -I MCU_Contest_2026 -I MCU_Contest_2026/sim \
                "MCU_Contest_2026/$f" || exit 1
          done

  documentation:
    name: Documentation & Repository Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Mandatory Files
        run: |
          test -f README.md
          test -f CHANGELOG.md
          test -f .gitignore
          test -f MCU_Contest_2026/README.md
          test -f MCU_Contest_2026/Clock_Simulation.uvprojx
          test -f MCU_Contest_2026/sim/sim_main.c
          test -f MCU_Contest_2026/sim/SN32F400.h
          test -f MCU_Contest_2026/sim/Makefile
          echo "Documentation and structure verified."

      - name: Verify Contest Specifications Present
        run: |
          test -f "ĐỀ THI MCU 2026.pdf"
          test -f "ĐỀ THI FGPA 2026.docx.pdf"
          echo "Specification documents verified."
