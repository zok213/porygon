name: Repository Integrity Pipeline (main = baseline)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# NOTE: `main` carries the hardware-proven baseline (Quang build, verbatim).
# The full firmware verification stack - 55-check host simulation, cppcheck,
# production-path syntax, clang-format style gate - runs on `MCU_dev`, where
# the improved firmware lives. This pipeline guards the baseline tree.
jobs:
  fpga-rtl-verification:
    name: FPGA RTL Verification (iverilog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install iverilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Verify FPGA Source Files Exist
        run: |
          test -f FPGA/top.v
          test -f FPGA/pll_50mhz.v
          test -f FPGA/debouncer.v
          test -f FPGA/breathing_pwm.v
          test -f FPGA/uart_tx.v
          echo "FPGA sources present."

      - name: Run Verilog Syntax Check on all modules
        run: |
          find FPGA -name '*.v' -exec iverilog -t null {} +

  documentation:
    name: Documentation & Baseline Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Baseline Firmware Files (Quang build, verbatim)
        run: |
          test -f MCU_Contest_2026/main_clock_skeleton.c
          test -f MCU_Contest_2026/I2C0.c
          test -f MCU_Contest_2026/I2C.h
          test -f MCU_Contest_2026/Clock_Simulation.uvprojx
          test -f MCU_Contest_2026/RTE/Device/SN32F407F/startup_SN32F400.s
          test -f MCU_Contest_2026/RTE/Device/SN32F407F/system_SN32F400.c
          test -f MCU_Contest_2026/RTE/_Target_1/RTE_Components.h
          echo "Baseline firmware files present."

      - name: Check Mandatory Documents
        run: |
          test -f README.md
          test -f CHANGELOG.md
          test -f SETUP.md
          test -f .gitignore
          test -f MCU_Contest_2026/README.md
          test -f MCU_Contest_2026/TESTING.md
          test -f MCU_Contest_2026/Docs/README.md
          test -f MCU_Contest_2026/RTE/README.md
          test -f MCU_Contest_2026_Quang/README.md
          test -f FPGA/README.md
          test -f .github/README.md
          echo "Documentation verified."

      - name: Verify Contest Specifications Present
        run: |
          test -f "ĐỀ THI MCU 2026.pdf"
          test -f "ĐỀ THI FGPA 2026.docx.pdf"
          echo "Specification documents verified."
