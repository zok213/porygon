name: Firmware & RTL Verification Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  simulation:
    name: MCU Host Simulation (54 firmware checks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Host Toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Build Simulation Harness
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -DMOCK_SIMULATION \
              -I MCU_Contest_2026 -I MCU_Contest_2026/sim \
              MCU_Contest_2026/main.c MCU_Contest_2026/clock.c \
              MCU_Contest_2026/keypad.c MCU_Contest_2026/display.c \
              MCU_Contest_2026/buzzer.c MCU_Contest_2026/eeprom.c \
              MCU_Contest_2026/sim/SN32F400_mock.c \
              MCU_Contest_2026/sim/sim_main.c \
              -o clock_sim

      - name: Run Firmware Checks
        run: ./clock_sim

  static-analysis:
    name: MCU Static Analysis (cppcheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Run cppcheck on Firmware (host-build view)
        run: |
          cppcheck --enable=warning,style,performance,portability \
                   --error-exitcode=1 --suppress=missingIncludeSystem \
                   -DMOCK_SIMULATION -I MCU_Contest_2026 -I MCU_Contest_2026/sim \
                   MCU_Contest_2026/main.c MCU_Contest_2026/clock.c \
                   MCU_Contest_2026/keypad.c MCU_Contest_2026/display.c \
                   MCU_Contest_2026/buzzer.c MCU_Contest_2026/eeprom.c

  production-path:
    name: MCU Production Path Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Host Toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Syntax-check all modules (non-MOCK path, -Werror -pedantic)
        run: |
          for f in main.c clock.c keypad.c display.c buzzer.c eeprom.c; do
            gcc -std=c99 -Wall -Wextra -Werror -pedantic -fsyntax-only \
                -I MCU_Contest_2026 -I MCU_Contest_2026/sim \
                "MCU_Contest_2026/$f" || exit 1
          done

  code-style:
    name: Code Style (clang-format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pinned clang-format (identical to local tooling)
        run: |
          pip install --quiet clang-format==22.1.8

      - name: Verify firmware sources are clang-formatted
        run: |
          clang-format --dry-run --Werror \
            MCU_Contest_2026/main.c MCU_Contest_2026/clock.c \
            MCU_Contest_2026/clock.h MCU_Contest_2026/keypad.c \
            MCU_Contest_2026/keypad.h MCU_Contest_2026/display.c \
            MCU_Contest_2026/display.h MCU_Contest_2026/buzzer.c \
            MCU_Contest_2026/buzzer.h MCU_Contest_2026/eeprom.c \
            MCU_Contest_2026/eeprom.h MCU_Contest_2026/system.h \
            MCU_Contest_2026/app.h \
            MCU_Contest_2026/sim/sim_main.c \
            MCU_Contest_2026/sim/SN32F400.h \
            MCU_Contest_2026/sim/SN32F400_mock.c

  fpga-rtl-verification:
    name: FPGA RTL Verification (iverilog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install iverilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Verify FPGA Source Files Exist
        run: |
          test -f FPGA/top.v
          test -f FPGA/pll_50mhz.v
          test -f FPGA/debouncer.v
          test -f FPGA/breathing_pwm.v
          test -f FPGA/uart_tx.v
          echo "FPGA sources present."

      - name: Run Verilog Syntax Check on all modules
        run: |
          find FPGA -name '*.v' -exec iverilog -t null {} +

      - name: Verify FPGA Documentation
        run: |
          test -f FPGA/README.md
          echo "FPGA documentation verified."

  documentation:
    name: Documentation & Repository Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Mandatory Files
        run: |
          test -f README.md
          test -f CHANGELOG.md
          test -f SETUP.md
          test -f .gitignore
          test -f .github/README.md
          test -f MCU_Contest_2026/README.md
          test -f MCU_Contest_2026/TESTING.md
          test -f MCU_Contest_2026/CHANGES_VS_ORIGINAL.md
          test -f MCU_Contest_2026/sim/README.md
          test -f MCU_Contest_2026/Docs/README.md
          test -f MCU_Contest_2026/RTE/README.md
          test -f MCU_Contest_2026/Clock_Simulation.uvprojx
          test -f MCU_Contest_2026/sim/sim_main.c
          test -f MCU_Contest_2026/sim/SN32F400.h
          test -f MCU_Contest_2026/sim/Makefile
          test -f FPGA/README.md
          echo "Documentation and structure verified."

      - name: Verify Contest Specifications Present
        run: |
          test -f "ĐỀ THI MCU 2026.pdf"
          test -f "ĐỀ THI FGPA 2026.docx.pdf"
          test -f "Gowin-FPGA-Vietnamese-Book-ACG525-Basic-part-Print-v (1).pdf"
          echo "Specification documents verified."
